quarkus:
  # Both are separate dev services and BOTH must be off: with quarkus-oidc on the classpath either
  # starts a Keycloak container of its own, which then times out (~60s) and slows every build.
  keycloak:
    devservices:
      enabled: false
  oidc:
    devservices:
      enabled: false
    # Operator authentication (D10). Every value here was measured in the phase-0 spike — see
    # docs/D10-AUTH-PLAN.md §4. Four of them fail silently or fail closed if omitted.
    auth-server-url: ${SPIRE_OIDC_AUTH_SERVER_URL}
    client-id: ${SPIRE_OIDC_CLIENT_ID:spire-gateway}
    credentials:
      secret: ${SPIRE_OIDC_CLIENT_SECRET}
    # Cookie session for the browser AND the WebSocket upgrade (a browser cannot set a header on a
    # handshake); bearer for curl, CI and the SMOKE-TEST runbook.
    application-type: hybrid
    authentication:
      # Scopes the state cookie, the session cookie and its chunks to this service's own prefix, so
      # the browser never sends this service's session to another one. Measured, not assumed.
      cookie-path: /gw
      cookie-suffix: gw
      # Returns 499 + WWW-Authenticate to a script-initiated request instead of a 302 the SPA would
      # see as an opaque CORS failure.
      java-script-auto-redirect: false
      # MANDATORY: without it the redirect_uri is the REQUESTED path, which no realm can enumerate,
      # so the IdP rejects every protected path. It must also sit INSIDE cookie-path, or the callback
      # never receives the state cookie.
      redirect-path: /gw/auth/callback
      restore-path-after-redirect: true
    # MANDATORY: Keycloak puts realm_access in the ACCESS token while cookie mode reads the ID token.
    # Omit this and login succeeds with ZERO roles — every @RolesAllowed denies every operator, which
    # presents as a broken app rather than a security error.
    roles:
      source: accesstoken
    # Stops a token minted for one service being accepted by another. Requires a matching audience
    # mapper in the realm (infra/keycloak/realm-spire.json) — without one the IdP emits no `aud` and
    # login fails outright with "No Audience (aud) claim present".
    token:
      audience: ${SPIRE_OIDC_CLIENT_ID:spire-gateway}
  application:
    name: spire-gateway
  http:
    # Deny by default: anything not named here requires authentication. The inverse — permit-all with
    # named exceptions — fails OPEN, and what sits unnamed on this service is the registry holding
    # every repository's webhook secret.
    auth:
      permission:
        public:
          # An SCM cannot authenticate; the webhook edges verify an HMAC signature instead. This is
          # the one place where ADDING authentication would be the defect.
          paths: /webhooks/*,/q/health,/q/health/*
          policy: permit
        operator:
          paths: /gw/*
          policy: authenticated
    port: ${GATEWAY_HTTP_PORT:34081}   # host-exposed port in the 34xxx project range
    limits:
      # The /webhooks/{provider}/{key} edges are the only internet-facing, PRE-authentication
      # endpoints in the system, and they buffer the whole body in memory before the signature is
      # verified — so this cap, not the signature, is what bounds that exposure. Real PR-event
      # payloads are metadata only (the diff is never in them, ADR-011) and run well under 100K,
      # while the Quarkus default of 10M lets anyone who knows a webhook URL push memory pressure
      # 100x higher than any legitimate delivery needs. The registry CRUD API bodies are smaller
      # still, so one global limit covers both without a per-path rule.
      max-body-size: 1M
  # The gateway OWNS the per-repo webhook registry (its own schema). Same Postgres
  # as the orchestrator, but a schema-scoped role (GATEWAY_POSTGRES_*) with no access
  # to the orchestrator schema — a compromised edge cannot read the API-token registry.
  datasource:
    db-kind: postgresql
    jdbc:
      additional-jdbc-properties:
        currentSchema: gateway
  flyway:
    migrate-at-start: true
    default-schema: gateway
    create-schemas: true
  # Structured JSON logs in prod (observability rule); %dev/%test flip back to
  # plain console below. service/env ride on every line as static fields.
  log:
    console:
      json:
        enabled: true
        additional-field:
          service:
            value: spire-gateway
          env:
            value: ${quarkus.profile}

# Every SCM webhook is a per-repo registry edge routed by key
# (/webhooks/{provider}/{key}) — the secret is resolved per registration from the
# gateway's own webhook_repo table. Which SCMs are reviewed is the UI registry; no
# provider flag or global webhook secret exists.

spire:
  review:
    # Draft PRs are skipped on open/synchronize by default; the review fires on
    # ready_for_review instead. Set true to review drafts immediately (old behavior).
    draft-prs: false

# cs.integration: keyed by reviewId, JSON-serialized IntegrationEvent
# (CONTRACT §9). Broker address comes from KAFKA_BOOTSTRAP_SERVERS
# (kafka.bootstrap.servers); Dev Services boots a broker in dev/test when unset.
mp:
  messaging:
    outgoing:
      integration-out:
        connector: smallrye-kafka
        topic: cs.integration
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        value:
          serializer: dev.codespire.gateway.IntegrationEventSerializer

# Prod: the packaged deployment runs behind the dashboard image's nginx, which is the ONLY ingress
# and puts all four services on one origin so ADR-022's cookie-path scoping actually isolates them.
"%prod":
  quarkus:
    http:
      proxy:
        # Without this the service sees the proxy's address rather than the client's, and OIDC derives
        # redirect_uri from the wrong host. Nothing in dev needed it: Vite forwards no X-Forwarded-*.
        proxy-address-forwarding: true
        # Paired with the line above and equally required: proxy-address-forwarding alone honours
        # X-Forwarded-For and -Proto but NOT -Host, so OIDC still derived redirect_uri from this
        # service's own bind address (http://gateway:8080/...) and no realm could match it.
        enable-forwarded-host: true
        # Paired deliberately. docs/D10-AUTH-PLAN.md records the setting above as a header-spoofing
        # vector while service ports stay directly reachable — unpaired, anything that can reach this
        # port forges X-Forwarded-For and -Proto. That matters most here: this is the internet-facing
        # edge, and /webhooks/* is public because an SCM presents a signature rather than a session.
        trusted-proxies: ${SPIRE_TRUSTED_PROXIES}
    oidc:
      authentication:
        # A TLS terminator that forwards over plain http would otherwise yield a session cookie with
        # no Secure attribute, on a credential SECURITY.md already calls replayable in plaintext.
        cookie-force-secure: true

"%dev":
  spire:
    security:
      # BOTH gates must open together, or dev ends up half-authenticated. They are independent: the
      # permission policy below decides whether an identity is required at all, while this governs
      # the @RolesAllowed checks that run afterwards. With only the policy opened, REST answered 403
      # (anonymous identity, role check enforced) while the socket answered 101 (no annotation on it)
      # — the API broken and the socket wide open, which is worse than either state alone.
      auth-enabled: false
  quarkus:
    oidc:
      # Dev runs without an identity provider by default, so the tenant has nothing to discover and
      # the service would refuse to boot. Build-time disable is what works here — `tenant-enabled:
      # false` still demands an auth-server-url (measured in the spike).
      #
      # To develop WITH auth: point SPIRE_OIDC_AUTH_SERVER_URL at a Keycloak (either the compose
      # `--profile idp` one or your own), set SPIRE_OIDC_CLIENT_SECRET, and run with
      # -Dquarkus.oidc.enabled=true -Dquarkus.http.auth.permission.operator.policy=authenticated.
      enabled: false
    http:
      auth:
        permission:
          # Both gates open together. They are independent: this policy decides whether an identity
          # is required at all, and the @RolesAllowed annotations are checked afterwards. With OIDC
          # disabled there is no mechanism to satisfy `authenticated`, so leaving it would 401 every
          # request in dev rather than open it.
          operator:
            policy: permit
    log:
      console:
        json:
          enabled: false   # plain console for local readability
    datasource:
      username: ${GATEWAY_POSTGRES_USER}
      password: ${GATEWAY_POSTGRES_PASSWORD}
      jdbc:
        url: jdbc:postgresql://localhost:${POSTGRES_PORT:34432}/${POSTGRES_DB:spire}
  kafka:
    bootstrap:
      servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:34092}

"%test":
  quarkus:
    oidc:
      # Build-time disable. `tenant-enabled: false` is NOT enough — the tenant still demands an
      # auth-server-url and the app fails to boot, which surfaces as one failed test and every other
      # one SKIPPED, reading as 46 broken tests rather than one missing property.
      #
      # Authorization itself stays ON: the behavioural suites carry a class-level @TestSecurity
      # identity, so they exercise the real permission policy and the real @RolesAllowed annotations
      # rather than a relaxed variant. OperatorAuthTest covers the unauthenticated and wrong-role cases.
      enabled: false
    http:
      port: 0
      test-port: 0
    log:
      console:
        json:
          enabled: false   # plain console keeps test output readable
  spire:
    encryption:
      # Test-only webhook keyset (not a secret) — matches the orchestrator's so a
      # secret encrypted there decrypts here. Prod/dev read SPIRE_ENCRYPTION_WEBHOOK_KEYSET.
      webhook-keyset: 
