# The public LLM model catalog, format v1. Read ai-catalog/README.md before changing it.
# Every price is entered by hand from the vendor's own page, with pricing.sourceUrl and
# pricing.observedAt. A model is never removed: set lifecycle.status to RETIRED.
#
# Known limits of these figures (ai-catalog/PRICES-REVIEW.md, docs/UNVERIFIED.md):
# - one rate per type: OpenAI's long-context tier (>272K input) and Claude Haiku 5.5's (>100K) are
#   not modelled, so such calls are priced at the short-context rates below;
# - OpenAI's shortest cache write is 30 minutes; it is recorded as cacheWrite. Its 12-hour price has no field;
# - `api`: sources in ai-catalog/PRICES-REVIEW.md, "Request settings". reasoningEffort is null: the vendor's default applies.
providers:
  - code: openai
    displayName: OpenAI
    pricingUrl: https://developers.openai.com/api/docs/pricing
  - code: anthropic
    displayName: Anthropic
    pricingUrl: https://platform.claude.com/docs/en/about-claude/pricing
  - code: gemini
    displayName: Google Gemini
    pricingUrl: null
models:
