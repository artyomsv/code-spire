quarkus:
  # Both are separate dev services and BOTH must be off, or either starts a Keycloak container of
  # its own that then times out (~60s) on every build.
  keycloak:
    devservices:
      enabled: false
  oidc:
    devservices:
      enabled: false
    # Operator authentication (D10 slice 3). Values measured in the phase-0 spike — see
    # docs/D10-AUTH-PLAN.md §4; each comment says what breaks when the line is missing.
    auth-server-url: ${SPIRE_OIDC_AUTH_SERVER_URL}
    client-id: ${SPIRE_OIDC_CLIENT_ID:spire-orchestrator}
    credentials:
      secret: ${SPIRE_OIDC_CLIENT_SECRET}
    # Cookie session for the browser AND every WebSocket (a browser cannot set a header on a
    # handshake); bearer for curl, CI and the SMOKE-TEST runbook.
    application-type: hybrid
    authentication:
      # This service's whole surface lives under /api, sockets included, so one path scopes it. The
      # browser therefore never sends this session to the gateway (/gw) or the worker (/wk).
      cookie-path: /api
      cookie-suffix: api
      java-script-auto-redirect: false
      # Without it the redirect_uri is the REQUESTED path, which no realm can enumerate; it must also
      # sit INSIDE cookie-path or the callback never receives the state cookie.
      redirect-path: /api/auth/callback
      restore-path-after-redirect: true
    # Without this, login succeeds with ZERO roles and every @RolesAllowed denies every operator.
    roles:
      source: accesstoken
    # RP-initiated logout: ends the session at the identity provider too, not just here. Without it
    # the local cookie is dropped and the next login silently re-authenticates from the provider's
    # own session — which looks to the operator like logout did nothing.
    logout:
      path: /api/auth/logout
      post-logout-path: /
    # Needs the realm's audience mapper, or login fails with "No Audience (aud) claim present".
    token:
      audience: ${SPIRE_OIDC_CLIENT_ID:spire-orchestrator}
  application:
    name: spire-orchestrator
  http:
    # Deny by default: anything not named here requires authentication. The inverse fails OPEN, and
    # this service holds the provider registry, the event store and the dead-letter queue.
    auth:
      permission:
        public:
          # /api/me is the one deliberate hole in deny-by-default: a browser must be able to ask
          # whether it needs to log in BEFORE it has. It describes the caller, not the system.
          paths: /q/health,/q/health/*,/api/me
          policy: permit
        operator:
          # Covers every socket too — they all sit under /api/ws/* so one policy governs them,
          # including the per-run transcript tail, whose path carries the run id.
          paths: /api/*,/dev/*
          policy: authenticated
    port: ${ORCHESTRATOR_HTTP_PORT:34080}   # host-exposed port lives in the 34xxx project range
  datasource:
    db-kind: postgresql
    jdbc:
      additional-jdbc-properties:
        currentSchema: orchestrator
  flyway:
    migrate-at-start: true
    # schema-per-service: the orchestrator owns the event log.
    default-schema: orchestrator
    create-schemas: true
  # Structured JSON logs in prod (observability rule); %dev/%test flip back to
  # plain console below. service/env ride on every line as static fields.
  log:
    console:
      json:
        enabled: true
        additional-field:
          service:
            value: spire-orchestrator
          env:
            value: ${quarkus.profile}

# cs.* topics (CONTRACT §9), all keyed by reviewId. Broker address from
# KAFKA_BOOTSTRAP_SERVERS; Dev Services boots one in dev/test when unset.
mp:
  messaging:
    outgoing:
      integration-out:               # dev simulator only
        connector: smallrye-kafka
        topic: cs.integration
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        value:
          serializer: dev.codespire.orchestrator.pipeline.IntegrationEventSerializer
      commands-out:
        connector: smallrye-kafka
        topic: cs.commands
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        value:
          serializer: dev.codespire.orchestrator.pipeline.ActionCommandSerializer
      events-out:
        connector: smallrye-kafka
        topic: cs.events
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        value:
          serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
      run-commands-out:
        connector: smallrye-kafka
        # acks=all, because FR-F10 rests on what an acknowledgement MEANS. SmallRye defaults to 1 --
        # the leader alone -- so an ack can be lost on failover AFTER the 201, leaving the row queued
        # for ever: not dispatch_uncertain, so the resolution endpoint refuses it, a retry of the same
        # subject answers 409 for ever, and no attention row fires. That is FR-F10's mirror image with
        # no operator path out. It also re-enables producer idempotence, which the client disables
        # whenever acks is not all, so an internal retry can no longer append the same command twice.
        acks: all
        topic: cs.run-commands
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        value:
          serializer: dev.codespire.orchestrator.factory.RunCommandSerializer
        waitForWriteCompletion: true
      # Control rides its own topic, read by a listener beside the worker's executor rather than
      # behind it. Published here so an operator has a way to reach it: the consumer shipped first
      # and nothing produced to this topic, which made cancel reachable only by hand.
      run-control-out:
        connector: smallrye-kafka
        # acks=all for the reason given on run-commands-out above: a leader-only ack can be lost.
        acks: all
        topic: cs.run-control
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        value:
          serializer: dev.codespire.orchestrator.factory.RunCommandSerializer
        waitForWriteCompletion: true
    incoming:
      integration-in:
        connector: smallrye-kafka
        topic: cs.integration
        group:
          id: spire-orchestrator-integration
        value:
          deserializer: dev.codespire.orchestrator.pipeline.IntegrationEventDeserializer
        # work queue: a NEW consumer group must not replay history (M6);
        # processing failures go to cs.dlq, never silently dropped (ADR-013)
        auto:
          offset:
            reset: latest
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: cs.dlq
      results-in:
        connector: smallrye-kafka
        topic: cs.results
        group:
          id: spire-orchestrator-results
        value:
          deserializer: dev.codespire.orchestrator.pipeline.IntegrationEventDeserializer
        auto:
          offset:
            reset: latest
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: cs.dlq
      run-results-in:
        connector: smallrye-kafka
        topic: cs.run-results
        group:
          id: spire-orchestrator-run-results
        value:
          deserializer: dev.codespire.orchestrator.factory.RunResultDeserializer
        auto:
          offset:
            reset: latest
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: cs.dlq
      # The transcript (ADR-034). Not dead-lettered, because this tier is not replayable and nothing
      # derives state from it: a dead-letter queue exists for work that must not be lost, and filling
      # it with lines nobody will ever replay would crowd out the things it is for.
      #
      # But "not dead-lettered" is NOT the same as "no failure-strategy". The default is `fail`, so
      # leaving it out bought a stopped channel rather than a dropped line: one malformed record was
      # never committed and came back on every restart, and since readiness covers the whole service
      # that took the dashboard, the REST surface and the review pipeline down over one transcript
      # event. `ignore` is what the comment above always meant, and dlq-in below already says it.
      run-events-in:
        connector: smallrye-kafka
        topic: cs.run-events
        group:
          id: spire-orchestrator-run-events
        value:
          deserializer: dev.codespire.orchestrator.factory.RunEventDeserializer
        auto:
          offset:
            reset: latest
        failure-strategy: ignore
      events-in:
        connector: smallrye-kafka
        topic: cs.events
        group:
          id: spire-orchestrator-view
        value:
          deserializer: dev.codespire.orchestrator.eventstore.EnvelopeDeserializer
        # projector: rebuildable read model — earliest replay is correct; consumer
        # failures still land on cs.dlq (never silently dropped, ADR-013), because
        # an ignored failure here can lose a terminal status flip forever.
        auto:
          offset:
            reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: cs.dlq
          # the DLQ producer cannot mirror the custom EnvelopeDeserializer by
          # name — reuse the envelope serializer events-out publishes with
          value:
            serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
      dlq-in:
        connector: smallrye-kafka
        topic: cs.dlq
        group:
          id: spire-orchestrator-dlq
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # DLQ viewer (Step 2): persists every dead-lettered record for inspection +
        # manual replay/discard. A storage hiccup here must never re-loop into the
        # DLQ, so failures are ignored (never dead-letter-queue) — the consumer
        # itself never throws (DlqConsumer).
        auto:
          offset:
            reset: earliest
        failure-strategy: ignore

# Global review mode (see ReviewPolicy). observe = register SCM-originated triggers
# (PR events, /commands, replies), emit no work (no diff/LLM/comments). An operator's own
# admin REST action — the Re-run button, POST /api/runs — is the deliberate exception.
# The live value lives in the DB (app_setting, key
# review.mode) and is flipped from the Settings slider without a restart — that
# stored value is the sole control. The seed default (fresh DB, before the slider
# is ever used) is "observe" in code — safe first contact. The per-provider author
# allowlist lives in the provider registry, not here.
spire:
  factory:
    # Agent image per harness NAME. Keyed by name so the orchestrator never spells a harness; a
    # harness with no image here is refused at dispatch, before a row is written or a token moves.
    agent-image:
      codex: ${SPIRE_FACTORY_AGENT_IMAGE_CODEX:spire-agent-codex:latest}
    wall-clock-seconds: ${SPIRE_FACTORY_WALL_CLOCK_SECONDS:1800}
    # What a /fix run uses, since nobody types it. NO DEFAULTS on purpose: an operator who has
    # not named both has not turned /fix on, and the command says which key is missing rather
    # than picking a harness and a price on their behalf. Both are refused at dispatch, before a
    # row is written or a token moves -- the same place an unconfigured agent image is refused.
    fix:
      harness: ${SPIRE_FACTORY_FIX_HARNESS:}
      model: ${SPIRE_FACTORY_FIX_MODEL:}
  review:
    # Bounded auto-retry (C8/ADR-016): total pipeline runs before a transient
    # failure fails terminally. Tuning knob — a safe default is fine here.
    max-attempts: ${SPIRE_REVIEW_MAX_ATTEMPTS:3}
  security:
    # SSRF guard (CWE-918): provider baseUrl must be https and resolve to a
    # public address, because create/update whoami()s it server-side. Fail-closed
    # here; only %dev/%test relax it for http://localhost WireMock SCMs.
    allow-insecure-provider-urls: false
  attention:
    # How long a review may sit without progressing before the panel calls it stalled. A review
    # normally finishes in seconds, so 15 minutes of silence means the delivery path or a worker is
    # broken. There is no companion window for failed reviews: a failure is acknowledged, not aged
    # out, because a timer would retire one nobody ever saw.
    stuck-minutes: ${SPIRE_ATTENTION_STUCK_MINUTES:15}
    # How often the server re-evaluates for transitions no write announces (a review crossing the
    # stuck threshold). Server-side and shared by every connection, and a push happens only when the
    # condition set changed -- so an idle system is silent however many dashboards are open.
    sweep-seconds: ${SPIRE_ATTENTION_SWEEP_SECONDS:10}

# Prod: the packaged deployment runs behind the dashboard image's nginx, which is the ONLY ingress
# and puts all four services on one origin so ADR-022's cookie-path scoping actually isolates them.
"%prod":
  quarkus:
    http:
      proxy:
        # Without this the service sees the proxy's address rather than the client's, and OIDC derives
        # redirect_uri from the wrong host. Nothing in dev needed it: Vite forwards no X-Forwarded-*.
        proxy-address-forwarding: true
        # Paired with the line above and equally required: proxy-address-forwarding alone honours
        # X-Forwarded-For and -Proto but NOT -Host, so OIDC still derived redirect_uri from this
        # service's own bind address (http://orchestrator:8080/...) and no realm could match it.
        enable-forwarded-host: true
        # Paired deliberately. docs/D10-AUTH-PLAN.md records the setting above as a header-spoofing
        # vector while service ports stay directly reachable — unpaired, anything that can reach this
        # port forges X-Forwarded-For and -Proto. No deploy artifact publishes a service port, and
        # deploy/helm/spire/tests/render.sh asserts that. No default: the value is topology-specific.
        trusted-proxies: ${SPIRE_TRUSTED_PROXIES}
    oidc:
      authentication:
        # A TLS terminator that forwards over plain http would otherwise yield a session cookie with
        # no Secure attribute, on a credential SECURITY.md already calls replayable in plaintext.
        cookie-force-secure: true

# Dev: docker-compose Postgres + Redpanda. Credentials come from .env (Quarkus
# loads it from the project root) — NO defaults for credentials, fail fast.
"%dev":
  spire:
    security:
      allow-insecure-provider-urls: true   # local WireMock/simulator SCMs are http://localhost
      # BOTH gates open together, or dev is half-authenticated: the permission policy decides whether
      # an identity is required at all, and this governs the @RolesAllowed checks that run afterwards.
      # Opening only one gave 403 on REST while a socket answered 101 — the API broken and the socket
      # wide open, which is worse than either state alone.
      auth-enabled: false
  kafka:
    bootstrap:
      servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:34092}
  quarkus:
    oidc:
      # Dev runs without an identity provider, so the tenant has nothing to discover and the service
      # would refuse to boot. Build-time disable is what works — `tenant-enabled: false` still demands
      # an auth-server-url (measured in the spike).
      enabled: false
    http:
      auth:
        permission:
          # The other half of the switch above: with OIDC off there is no mechanism to satisfy
          # `authenticated`, so leaving it would 401 every dev request rather than open it.
          operator:
            policy: permit
    log:
      console:
        json:
          enabled: false   # plain console for local readability
    datasource:
      username: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      jdbc:
        url: jdbc:postgresql://localhost:${POSTGRES_PORT:34432}/${POSTGRES_DB:spire}

# Test: DevServices boot Postgres + a broker automatically.
"%test":
  spire:
    review:
      # Tests exercise the active pipeline — seed active (prod/dev seed observe in code).
      mode: active
    security:
      allow-insecure-provider-urls: true   # tests register providers against http://localhost WireMocks
    encryption:
      # Test-only AES-GCM master keyset (not a secret). Prod/dev read SPIRE_ENCRYPTION_KEYSET.
      # The webhook keyset now lives only with the gateway (it owns webhook secrets).
      keyset: 
  quarkus:
    oidc:
      # Build-time disable. `tenant-enabled: false` is NOT enough — the tenant still demands an
      # auth-server-url and the app fails to BOOT, which surfaces as one failed test and every other
      # one skipped rather than as a configuration error.
      #
      # Authorization itself stays ON: the behavioural suites carry a @TestSecurity identity, so they
      # exercise the real permission policy and the real annotations.
      enabled: false
    http:
      port: 0
      test-port: 0
    log:
      console:
        json:
          enabled: false   # plain console keeps test output readable
  mp:
    messaging:
      incoming:
        integration-in:
          auto:
            offset:
              reset: earliest
        results-in:
          auto:
            offset:
              reset: earliest
