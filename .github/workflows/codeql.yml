# CodeQL over both languages. Free on a public repository.
#
# Java needs a manual build because the project is Gradle multi-module with a Java 25 toolchain, which
# autobuild cannot infer; `assemble` is enough and matches what ci.yml already proves works.
name: codeql

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Weekly, so new queries reach existing code rather than only new code.
    - cron: '41 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # CodeQL builds a database by watching the compiler run. A restored build cache makes every
          # compile task up-to-date, so nothing is watched and analysis fails with "didn't build any of
          # it" — a green-looking setup that analyses zero code. Caching is therefore off in this job
          # only; ci.yml still gets the fast cached build.
          cache-disabled: true

      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # `clean` and --no-build-cache for the same reason: the compiler must actually run.
      - if: matrix.build-mode == 'manual'
        run: ./gradlew clean assemble --no-daemon --no-build-cache --console=plain

      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          category: /language:${{ matrix.language }}
