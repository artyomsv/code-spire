# CodeQL over both languages. Free on a public repository.
#
# Java needs a manual build because the project is Gradle multi-module with a Java 25 toolchain, which
# autobuild cannot infer; `assemble` is enough and matches what ci.yml already proves works.
name: codeql

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Weekly, so new queries reach existing code rather than only new code.
    - cron: '41 4 * * 1'

permissions:
  contents: read
  security-events: write

# A superseded run is noise, not evidence. Two merges landing seconds apart — the shape a bump split
# across two PRs produces — otherwise leave one run analysing a tree that is no longer master's head.
# Cancelling is safe: results are uploaded per run, so the survivor re-uploads for the newer commit.
# Matches docker.yml, which already groups this way.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # CodeQL builds a database by watching the compiler run. A restored build cache makes every
          # compile task up-to-date, so nothing is watched and analysis fails with "didn't build any of
          # it" — a green-looking setup that analyses zero code. Caching is therefore off in this job
          # only; ci.yml still gets the fast cached build.
          cache-disabled: true

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # `clean` and --no-build-cache for the same reason: the compiler must actually run.
      - if: matrix.build-mode == 'manual'
        run: ./gradlew clean assemble --no-daemon --no-build-cache --console=plain

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}
