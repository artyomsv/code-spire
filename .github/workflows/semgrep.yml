# Semgrep, reporting to the Security tab rather than blocking.
#
# The plan called for this to block, on the basis that the repository is already Semgrep-clean. It is
# not, under p/default + p/secrets: a measured run found 54 findings across six rules. Two are
# pre-existing (a formatted SQL string in AttentionQueries, and detect-insecure-websocket matching the
# word ws:// inside a COMMENT in vite.config.ts), and 45 are github-actions-mutable-action-tag — the
# advice to pin every action to a commit SHA rather than a moving @v4 tag.
#
# Blocking would therefore mean either fixing a pre-existing baseline as part of adding CI, or pinning
# 45 action references in the same change. Both are real decisions with their own scope; bundling them
# into "add a scanner" is how adding a scanner turns into a cleanup nobody asked for. The SHA-pinning
# decision is recorded in techdebt/global/ instead.
#
# The four findings this work introduced were fixed rather than filed: a securityContext on each of the
# three bundled infrastructure workloads, and a `curl | bash` installer replaced with pinned release
# archives.
#
# Flip --error on once the baseline is clean and the pinning decision is made.
name: semgrep

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        # p/default and p/secrets explicitly, not --config=auto: auto requires metrics to be enabled and
        # resolves its ruleset over the network, so what it checks can change without a commit here.
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/secrets \
            --metrics=off \
            --sarif --output=semgrep.sarif \
            --skip-unknown-extensions .
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
