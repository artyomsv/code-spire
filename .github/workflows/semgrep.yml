# Semgrep, reporting to the Security tab rather than blocking.
#
# The baseline this deferred is now clean. Every action reference is pinned to a commit SHA, the
# formatted SQL string in AttentionQueries is gone, and the three detect-insecure-websocket hits were
# all the scheme literal appearing in PROSE — a comment here, a comment in vite.config.ts, and a
# techdebt entry — which is why they are now written without it rather than suppressed.
#
# It still does not block, and that is a separate decision from a clean baseline. p/default and
# p/secrets are resolved from the Semgrep registry at run time, so the rule set can change without a
# commit in this repository: a blocking gate would turn a rule addition upstream into a red PR on an
# untouched branch. Reporting to the Security tab surfaces the same findings and leaves triage here.
#
# Making it block wants a pinned rule set first — vendored rules, or a semgrep version and ruleset
# digest recorded in this file. Until then --error stays off deliberately, not by omission.
name: semgrep

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan
        # p/default and p/secrets explicitly, not --config=auto: auto requires metrics to be enabled and
        # resolves its ruleset over the network, so what it checks can change without a commit here.
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/secrets \
            --metrics=off \
            --sarif --output=semgrep.sarif \
            --skip-unknown-extensions .
      - uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
