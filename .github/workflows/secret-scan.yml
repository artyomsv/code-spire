# gitleaks over the full history on every change.
#
# .gitleaks.toml narrows exactly one rule — the entropy-based `generic-api-key` — and every specific
# rule stays in force. The eight findings it suppresses were each verified by hand: the RFC 6455
# handshake nonce, config values that are ${VAR} references rather than secrets, and English prose in
# design documents. Suppression is by shape rather than by fingerprint, because a fingerprint is
# commit:file:rule:line and stops matching the moment a line moves.
#
# Verified to still catch: an AWS key and a GitHub PAT planted in a markdown file are both flagged.
name: secret-scan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: a secret removed in a later commit is still a leaked secret.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
