# The topology check, against the published :edge images.
#
# Every other workflow verifies something a developer can also verify locally. This one cannot be:
# the single-origin proxy does not exist in dev, where Vite supplies the origin and the webhook tunnel
# points straight at the gateway. Its subject is the packaged artifact, which is why it pulls rather
# than builds.
#
# Nightly and on demand, never on the PR path.
name: e2e

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  round-trip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two independent Tink keysets per run, so none is ever committed or reused. The generator is a
      # real Gradle task in spire-encryption — a random base64 string is NOT a valid keyset.
      - name: Generate keysets
        run: |
          MASTER_KEYSET="$(./gradlew -q :spire-encryption:generateKeyset --console=plain | tail -1)"
          WEBHOOK_KEYSET="$(./gradlew -q :spire-encryption:generateKeyset --console=plain | tail -1)"
          # Masked so a later step that dumps the environment cannot print them into a public log.
          echo "::add-mask::$MASTER_KEYSET"
          echo "::add-mask::$WEBHOOK_KEYSET"
          echo "MASTER_KEYSET=$MASTER_KEYSET" >> "$GITHUB_ENV"
          echo "WEBHOOK_KEYSET=$WEBHOOK_KEYSET" >> "$GITHUB_ENV"

      # Every value below is obviously synthetic. The realm ships the same three client secrets, and no
      # real credential enters CI.
      - name: Write the environment
        run: |
          cat > deploy/.env <<ENV
          SPIRE_UI_PORT=34700
          SPIRE_KEYCLOAK_PORT=34767
          POSTGRES_DB=spire
          POSTGRES_USER=spire
          POSTGRES_PASSWORD=TEST-postgres-password
          GATEWAY_POSTGRES_USER=gateway
          GATEWAY_POSTGRES_PASSWORD=TEST-gateway-password
          SPIRE_ENCRYPTION_KEYSET=${MASTER_KEYSET}
          SPIRE_ENCRYPTION_WEBHOOK_KEYSET=${WEBHOOK_KEYSET}
          SPIRE_OIDC_AUTH_SERVER_URL=http://host.docker.internal:34767/realms/spire
          SPIRE_OIDC_ORCHESTRATOR_SECRET=dev-only-orchestrator-secret
          SPIRE_OIDC_GATEWAY_SECRET=dev-only-gateway-secret
          SPIRE_OIDC_WORKER_SECRET=dev-only-worker-secret
          KEYCLOAK_ADMIN_USER=dev-admin
          KEYCLOAK_ADMIN_PASSWORD=TEST-keycloak-admin
          SPIRE_TRUSTED_PROXIES=172.16.0.0/12
          SPIRE_VERSION=edge
          ENV
          if grep -qE '^SPIRE_ENCRYPTION_(WEBHOOK_)?KEYSET=$' deploy/.env; then
            echo "keyset generation produced nothing"; exit 1
          fi

      - name: Up
        run: docker compose -f deploy/compose.ghcr.yml --env-file deploy/.env up -d --pull always

      - name: Wait for the dashboard
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:34700/api/me; then exit 0; fi
            sleep 5
          done
          echo "the dashboard never became reachable"; exit 1

      - name: Round-trip
        env:
          # The realm's two obviously-synthetic dev users.
          DEV_VIEWER_PASSWORD: dev-viewer
          DEV_OPERATOR_PASSWORD: dev-operator
        run: |
          set -a; . deploy/.env; set +a
          export SPIRE_COMPOSE_FILE=deploy/compose.ghcr.yml
          bash ./deploy/e2e.sh http://localhost:34700 http://localhost:34767

      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.ghcr.yml --env-file deploy/.env logs --tail 200
      - name: Down
        if: always()
        run: docker compose -f deploy/compose.ghcr.yml --env-file deploy/.env down -v

  # The review loop, against a REAL GitLab.
  #
  # Separate from round-trip above because their subjects differ: that one checks the published
  # artifact's topology, this one drives the whole review loop — webhook to comment to reconciliation
  # — through a containerised gitlab-ce. It BUILDS from the checkout rather than pulling :edge,
  # because the code under test is the branch's.
  gitlab-loop:
    runs-on: ubuntu-latest
    # gitlab-ce alone is a five-minute boot on a warm cache and longer on a cold one, and the chain
    # then runs four merge requests through real webhook delivery with two model calls per round.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Two independent keysets per run, so none is ever committed or reused. The generator is a real
      # Gradle task — a random base64 string is NOT a valid Tink keyset.
      - name: Generate keysets
        run: |
          MASTER_KEYSET="$(./gradlew -q :spire-encryption:generateKeyset --console=plain | tail -1)"
          WEBHOOK_KEYSET="$(./gradlew -q :spire-encryption:generateKeyset --console=plain | tail -1)"
          # Masked so a later step that dumps the environment cannot print them into a public log.
          echo "::add-mask::$MASTER_KEYSET"
          echo "::add-mask::$WEBHOOK_KEYSET"
          echo "MASTER_KEYSET=$MASTER_KEYSET" >> "$GITHUB_ENV"
          echo "WEBHOOK_KEYSET=$WEBHOOK_KEYSET" >> "$GITHUB_ENV"

      # Every value below is obviously synthetic. No real credential enters CI, and the GitLab this
      # creates is destroyed with the runner.
      - name: Write the environment
        run: |
          cat > deploy/.env <<ENV
          SPIRE_UI_PORT=34800
          SPIRE_KEYCLOAK_PORT=34867
          POSTGRES_DB=spire
          POSTGRES_USER=spire
          POSTGRES_PASSWORD=TEST-postgres-password
          GATEWAY_POSTGRES_USER=gateway
          GATEWAY_POSTGRES_PASSWORD=TEST-gateway-password
          SPIRE_ENCRYPTION_KEYSET=${MASTER_KEYSET}
          SPIRE_ENCRYPTION_WEBHOOK_KEYSET=${WEBHOOK_KEYSET}
          SPIRE_OIDC_AUTH_SERVER_URL=http://host.docker.internal:34867/realms/spire
          SPIRE_OIDC_ORCHESTRATOR_SECRET=dev-only-orchestrator-secret
          SPIRE_OIDC_GATEWAY_SECRET=dev-only-gateway-secret
          SPIRE_OIDC_WORKER_SECRET=dev-only-worker-secret
          KEYCLOAK_ADMIN_USER=admin
          KEYCLOAK_ADMIN_PASSWORD=TEST-keycloak-admin-password
          SPIRE_TRUSTED_PROXIES=172.16.0.0/12
          SPIRE_PUBLIC_HOST=
          SPIRE_VERSION=edge
          E2E_GITLAB_ROOT_PASSWORD=TEST-gitlab-root-password
          E2E_GITLAB_PORT=34880
          E2E_LLM_MOCK_PORT=34881
          DEV_OPERATOR_PASSWORD=dev-operator
          DEV_VIEWER_PASSWORD=dev-viewer
          ENV

      - name: Start the stack
        run: |
          docker compose -f deploy/compose.yml -f deploy/compose.e2e.yml \
            --env-file deploy/.env up -d --build

      # Polled, not slept. GitLab's first boot runs database migrations whose duration depends on the
      # runner, and a fixed sleep is either wasteful or wrong.
      - name: Wait for GitLab
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 10 http://localhost:34880/users/sign_in >/dev/null 2>&1; then
              echo "GitLab ready"; exit 0
            fi
            sleep 20
          done
          echo "GitLab never became ready"
          docker compose -f deploy/compose.yml -f deploy/compose.e2e.yml \
            --env-file deploy/.env logs gitlab --tail 100
          exit 1

      - name: Run the suite
        run: |
          set -a; . deploy/.env; set +a
          ./gradlew testE2e --no-daemon --console=plain

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitlab-loop-diagnostics
          path: spire-e2e/build/e2e-diagnostics
          if-no-files-found: warn
          # Bounded rather than the 90-day repo default: the bundle is fixture-only today, but its
          # contract is "capture everything a failed run needs", which makes it a standing channel.
          retention-days: 7

      - name: Down
        if: always()
        run: |
          docker compose -f deploy/compose.yml -f deploy/compose.e2e.yml \
            --env-file deploy/.env down -v
