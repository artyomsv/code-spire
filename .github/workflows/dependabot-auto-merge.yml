# Auto-merges the update classes that are maintenance rather than decisions.
#
# **Never major, for any ecosystem.** The first version of this rule scoped npm to patch but scoped
# github_actions by ecosystem alone, so within minutes of being enabled it merged three MAJOR action
# bumps unreviewed — setup-node 4→7, build-push-action 6→7, gitleaks-action 2→3. Those happened to be
# fine; the rule that let them through was not. A major bump is a decision by definition.
#
# --auto merges only once required checks pass, so ci.yml still gates every one of these.
#
# **Approval cannot come from GITHUB_TOKEN, and the platform refuses it outright:**
#
#     GraphQL: GitHub Actions is not permitted to approve pull requests. (addPullRequestReview)
#
# That is not a permissions setting to widen — it is a rule about the default token, and no value of
# `permissions:` changes it. It matters because branch protection requires an approving review and
# `gh pr merge --auto` does not supply one, so an armed PR waits forever reporting BLOCKED rather
# than any kind of failure. An earlier version of this file carried a step *named* "Approve and
# enable auto-merge" that only enabled auto-merge, and eleven dependabot PRs duly accumulated green
# and unmerged with nothing anywhere saying why.
#
# So approval needs a token belonging to a person: an optional repository secret,
# DEPENDABOT_APPROVE_TOKEN — a fine-grained PAT scoped to this repository with Pull requests: write.
# Without it this job still arms auto-merge and the PR merges the moment a human approves; the only
# thing lost is the last manual step. Absence is reported as a notice, never as a failure, because a
# red check on every dependabot PR is worse than the silent wait it replaced.
name: dependabot-auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve and enable auto-merge
        # Major is excluded first and for every ecosystem, so no later clause can readmit it.
        if: |
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          (
            (steps.meta.outputs.package-ecosystem == 'github_actions' &&
             steps.meta.outputs.update-type == 'version-update:semver-minor') ||
            steps.meta.outputs.update-type == 'version-update:semver-patch'
          )
        # One step, one `if`. Splitting approve and arm into two steps would duplicate that condition,
        # and two copies of an admission rule are free to drift — which is the whole failure this file
        # already documents once. Approve runs first because --auto is a no-op on a PR that is already
        # mergeable, so the reverse order would leave it waiting for the next check event.
        run: |
          if [ -n "$APPROVE_TOKEN" ]; then
            GH_TOKEN="$APPROVE_TOKEN" gh pr review --approve "$PR_URL" \
              --body "Auto-approved: ${{ steps.meta.outputs.package-ecosystem }} ${{ steps.meta.outputs.update-type }}, within the maintenance classes dependabot-auto-merge.yml admits."
          else
            echo "::notice::DEPENDABOT_APPROVE_TOKEN is not set. Auto-merge is armed, but branch protection will hold this PR until a human approves it."
          fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVE_TOKEN: ${{ secrets.DEPENDABOT_APPROVE_TOKEN }}
