# Fast feedback on every change. Five jobs, split by what each one needs:
#
#   fast     - the 13 modules whose tests run on a bare JVM. Budgeted under 3 minutes.
#   ui       - exactly the three commands spire-ui already has. No linter is added here: the project
#              has no eslint baseline, and bundling one into CI onboarding would turn "add CI" into
#              "clean up every lint violation".
#   kubernetes, kubernetes-open - the Kubernetes arm against a real kind cluster, with and without a
#              policy-enforcing CNI.
#   services - the three deployables, whose tests boot Postgres + Kafka Dev Services containers,
#              plus `assemble`.
#
# Why `assemble` and not just tests: Gradle's `test` task uses the toolchain while Quarkus PACKAGING
# runs on the daemon's JVM. With an older JAVA_HOME every test passes and packaging then fails with
# `UnsupportedClassVersionError ... class file version 69.0`, so only packaging exercises that path.
# `assemble` rather than `build` because `build` would re-run the fast tier the first job covered.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The model catalog every install reads: strict rules, plus "never remove a model" and "a
      # changed price changes observedAt" against the copy on master. No copy on master yet means
      # no base, so only the strict rules apply.
      - name: Check the model catalog
        run: |
          git fetch --no-tags --depth=1 origin master
          git show origin/master:ai-catalog/v1/catalog.yaml > "$RUNNER_TEMP/base-catalog.yaml" \
            || rm -f "$RUNNER_TEMP/base-catalog.yaml"
          ./gradlew :spire-llm-catalog:checkCatalog --no-daemon --console=plain \
            --args="ai-catalog/v1/catalog.yaml $RUNNER_TEMP/base-catalog.yaml"
      - run: ./gradlew testFast --no-daemon --console=plain

  ui:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spire-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # node-version tracks spire-ui/Dockerfile and Dockerfile.dev. Nothing enforces that pairing and
      # nothing proposes it: dependabot's docker ecosystem rewrites FROM lines only, so a base-image
      # bump landing alone leaves this job testing a runtime the image no longer ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: spire-ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build

  services:
    name: service tests + packaging
    runs-on: ubuntu-latest
    # Cold-cache runs pull the whole Gradle graph and every Dev Services image and took 40+ minutes;
    # warm they finish in under three. Bounded so a hung job fails in an hour rather than burning the
    # six-hour default. See techdebt/global/4-3.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Dev Services needs a Docker daemon; ubuntu-latest provides one.
      - run: ./gradlew testServices --no-daemon --console=plain
      - run: ./gradlew assemble --no-daemon --console=plain

  # The Kubernetes arm's tests run against a real cluster: kind with Calico, which enforces network policy.
  # The images the tests start are built here and loaded into the cluster, so no pull is needed.
  kubernetes:
    name: kubernetes arm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the test images
        run: |
          ./gradlew :spire-publisher:installDist :spire-model-proxy:installDist --no-daemon --console=plain
          docker build -t spire-publisher:TEST spire-publisher
          docker build -t spire-model-proxy:TEST spire-model-proxy
          docker build -t spire-egress-proxy:TEST deploy/egress
          docker build -t spire-test-unit:TEST spire-runtime-k8s/src/test/docker/unit
      # wait: 0s because a cluster with no CNI has no Ready node until the CNI is applied below.
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: spire-test
          config: .github/kind/policy.yaml
          wait: 0s
      - name: Install Calico (policy-enforcing CNI)
        # Calico v3.31.0, pinned by release tag.
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.31.0/manifests/calico.yaml
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl -n kube-system rollout status deployment/coredns --timeout=300s
      - name: Load the images into the cluster
        run: |
          kind load docker-image --name spire-test \
            spire-publisher:TEST spire-model-proxy:TEST spire-egress-proxy:TEST spire-test-unit:TEST
      - run: ./gradlew testKubernetes --no-daemon --console=plain
      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl get nodes,pods -A -o wide || true
          kubectl -n kube-system describe pods -l k8s-app=kube-dns || true
          kubectl -n kube-system logs -l k8s-app=calico-node --tail=50 --all-containers || true

  # The same arm against a cluster that enforces nothing (flannel): proves the tests that need an open
  # cluster see one.
  kubernetes-open:
    name: kubernetes arm, no policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the test images
        run: |
          ./gradlew :spire-publisher:installDist :spire-model-proxy:installDist --no-daemon --console=plain
          docker build -t spire-publisher:TEST spire-publisher
          docker build -t spire-model-proxy:TEST spire-model-proxy
          docker build -t spire-egress-proxy:TEST deploy/egress
          docker build -t spire-test-unit:TEST spire-runtime-k8s/src/test/docker/unit
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: spire-test
          config: .github/kind/open.yaml
          wait: 0s
      # flannel refuses to start without the bridge netfilter sysctls, which the runner kernel only has once
      # the module is loaded.
      - name: Load br_netfilter
        run: sudo modprobe br_netfilter
      - name: Install flannel (no network policy)
        # flannel v0.27.4, pinned by release tag.
        run: |
          kubectl apply -f https://github.com/flannel-io/flannel/releases/download/v0.27.4/kube-flannel.yml
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl -n kube-system rollout status deployment/coredns --timeout=300s
      - name: Load the images into the cluster
        run: |
          kind load docker-image --name spire-test \
            spire-publisher:TEST spire-model-proxy:TEST spire-egress-proxy:TEST spire-test-unit:TEST
      - run: ./gradlew :spire-runtime-k8s:openClusterTest --no-daemon --console=plain
      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl get nodes,pods -A -o wide || true
          kubectl -n kube-system describe pods -l k8s-app=kube-dns || true
          kubectl -n kube-system logs -l k8s-app=kube-dns --tail=50 || true
          kubectl -n kube-flannel logs -l app=flannel --tail=50 --all-containers || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -30 || true
          docker exec spire-test-control-plane sh -c 'ls /etc/cni/net.d /opt/cni/bin; journalctl -u kubelet --no-pager | tail -40' || true
