# Everything under deploy/ gets a real check, because "remember to regenerate" is not a mechanism.
#
# The load-bearing gates are render-manifests.sh --check (Helm, kustomize and kubectl-apply users must
# receive the same manifests) and tests/render.sh (the invariants that exist only as configuration
# shape). `helm lint` runs but is NOT a gate: it reports every missing required value as a WARNING and
# exits 0 — measured, not assumed — so a lint-only check would pass a chart that cannot install. That
# property is enforced by assertion 8 in tests/render.sh instead.
name: manifests

#
# The pull_request trigger carries NO paths filter, and that is deliberate rather than an oversight.
# A path-filtered workflow cannot supply a required status check: on a pull request that misses the
# filter the context is never produced at all, and a required context that never arrives leaves the
# pull request pending forever rather than passing. It reads as stuck CI, not as a settings mistake.
# So the filter moved inside — `changes` decides, the two expensive jobs skip when nothing relevant
# moved, and `manifests gate` always reports. The gate is the context to require.
#
# push keeps its filter: nothing requires a status check there, and a master push that touches no
# manifest has no reason to spend a kind cluster.
on:
  pull_request:
  push:
    branches: [master]
    paths:
      - 'deploy/**'
      - 'spire-ui/nginx/**'
      - 'spire-*/src/main/resources/application.yml'
      # The workflow's own file, or a change to it lands on master unexercised — which is exactly what
      # happened to the Helm pin: it was pushed and nothing ran to confirm it.
      - '.github/workflows/manifests.yml'

permissions:
  contents: read

jobs:
  # The paths filter that used to live on the pull_request trigger. Same set, evaluated here so the
  # workflow always runs and always reports, whether or not it had anything to do.
  changes:
    name: detect manifest changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The diff reaches back to the pull request's base; a shallow clone cannot see it.
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Anything that is not a pull request already passed the trigger's own paths filter, so
          # there is nothing left to decide: run.
          if [ -z "$BASE" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE"...HEAD | grep -qE \
               '^deploy/|^spire-ui/nginx/|^spire-[A-Za-z0-9-]+/src/main/resources/application\.yml$|^\.github/workflows/manifests\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: invariants and drift
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Read the required Helm from render-manifests.sh so there is ONE source of truth. Two reasons it
      # must be pinned at all: `kustomize --enable-helm` detects helm via `helm version -c --short` and
      # Helm 4 removed -c, and Helm's rendered output is not byte-identical across majors, so a
      # different version turns the drift check into whitespace noise. Both were observed, not guessed.
      - id: helm-version
        run: echo "v=v$(sed -n 's/^REQUIRED_HELM=//p' deploy/render-manifests.sh)" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.helm-version.outputs.v }}
      # Pinned release archives rather than `curl | bash`. Piping an installer script straight into a
      # shell means whatever that URL serves at the moment CI runs executes with the job's permissions,
      # and the version is whatever HEAD happens to be.
      - name: Install kustomize and kubeconform
        env:
          KUSTOMIZE_VERSION: v5.7.1
          KUBECONFORM_VERSION: v0.7.0
        run: |
          curl -sSfL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          curl -sSfL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kustomize /tmp/kubeconform /usr/local/bin/
          kustomize version && kubeconform -v

      # Informational: see the header. Kept because it still catches malformed templates.
      - name: helm lint (informational)
        run: |
          helm lint deploy/helm/spire -f deploy/helm/spire/values-simple.yaml
          helm lint deploy/helm/spire -f deploy/helm/spire/values-production.yaml

      - name: Invariants
        run: bash ./deploy/helm/spire/tests/render.sh

      # Proves each assertion above catches its own break. Four of them are negative — the value must
      # be ABSENT where it does not belong — and a negative assertion passes trivially when a key is
      # renamed, so a green run is otherwise indistinguishable from greps that matched nothing.
      - name: Invariants discriminate
        run: bash ./deploy/helm/spire/tests/render.sh --self-test

      - name: No drift between the chart and the rendered manifests
        run: bash ./deploy/render-manifests.sh --check

      # LoadRestrictionsNone is required: the chart and its preset values deliberately live outside the
      # kustomization directory, because duplicating them there would give one preset two sources.
      - name: kustomize builds both overlays
        run: |
          for preset in simple production; do
            kustomize build --enable-helm --load-restrictor LoadRestrictionsNone \
              "deploy/kustomize/overlays/$preset" > "/tmp/$preset.yaml"
            echo "$preset: $(grep -c '^kind:' "/tmp/$preset.yaml") resources"
          done

      - name: Schemas
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/k8s/simple/spire.yaml deploy/k8s/production/spire.yaml

  kind-install:
    name: kind install (simple preset)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Pinned to Helm 3. `kustomize --enable-helm` detects helm by running `helm version -c
          # --short`, and Helm 4 removed the -c flag, so the action's default (latest) breaks chart
          # inflation with "unknown shorthand flag: 'c'". This passed locally only because that check
          # ran inside a container image bundling its own Helm 3 — the host helm is 4.x and fails
          # identically, so the local run was not evidence about CI.
          version: v3.21.3
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      # Obviously-synthetic values. The two keysets are real Tink keysets because the services validate
      # them; everything else is a TEST- placeholder.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Secrets
        run: |
          kubectl create secret generic spire-secrets \
            --from-literal=POSTGRES_PASSWORD=TEST-postgres-password \
            --from-literal=KEYCLOAK_ADMIN_PASSWORD=TEST-keycloak-admin \
            --from-literal=SPIRE_ENCRYPTION_KEYSET="$(./gradlew -q :spire-encryption:generateKeyset --console=plain | tail -1)" \
            --from-literal=SPIRE_OIDC_ORCHESTRATOR_SECRET=dev-only-orchestrator-secret \
            --from-literal=SPIRE_OIDC_GATEWAY_SECRET=dev-only-gateway-secret \
            --from-literal=SPIRE_OIDC_WORKER_SECRET=dev-only-worker-secret
          kubectl create secret generic spire-gateway-secrets \
            --from-literal=GATEWAY_POSTGRES_PASSWORD=TEST-gateway-password \
            --from-literal=SPIRE_ENCRYPTION_WEBHOOK_KEYSET="$(./gradlew -q :spire-encryption:generateKeyset --console=plain | tail -1)"

      # Proves the manifests apply AND the pods reach ready — including that the gateway-role hook
      # completes before the gateway starts, which is the real first-boot ordering constraint.
      - name: Install
        run: |
          helm install spire deploy/helm/spire \
            -f deploy/helm/spire/values-simple.yaml \
            --set secrets.existingSecret=spire-secrets \
            --set secrets.gatewayExistingSecret=spire-gateway-secrets \
            --set trustedProxies=10.244.0.0/16 \
            --set oidc.issuerHost=http://spire-keycloak:8080 \
            --set oidc.authServerUrl=http://spire-keycloak:8080/realms/spire \
            --wait --timeout 12m

      - name: Diagnose on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl get jobs
          kubectl logs -l app.kubernetes.io/name=spire --all-containers --tail=100 || true

  # The one context to require. It runs on every pull request, including those that touch nothing
  # under deploy/, which is exactly what the jobs above cannot promise.
  #
  # `skipped` has to pass and `failure` has to not, so this cannot be a bare `needs:` — a needed job
  # that is skipped would skip this one too, and a skipped required check never reports. Hence
  # `if: always()` plus an explicit read of the results.
  gate:
    name: manifests gate
    if: always()
    needs: [changes, verify, kind-install]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any manifests job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*)
              echo "A manifests job did not succeed."
              exit 1
              ;;
          esac
          echo "OK — every manifests job either succeeded or was skipped as irrelevant."
