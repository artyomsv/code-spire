# Cut on a v* tag: multi-arch, signed, SBOM'd — and gated on the same round-trip that runs nightly.
#
# The gate matters. A release publishes the artifact people install, and the single-origin topology it
# depends on cannot be verified anywhere but against a running stack. Publishing one that has never
# been exercised would make the release the first place a topology regression is discovered.
#
# arm64 goes through QEMU and costs tens of minutes on a JVM image, which is exactly why this is
# tag-triggered rather than on any per-merge path.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # the GitHub Release
  packages: write      # GHCR
  id-token: write      # cosign keyless

jobs:
  gate:
    name: round-trip before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      # amd64 only, loaded locally. The point is to exercise this commit's topology, not to publish.
      - name: Build the images under test
        run: |
          for svc in gateway orchestrator review-worker; do
            docker build --build-arg "SERVICE=$svc" -t "ghcr.io/artyomsv/spire-$svc:edge" .
          done
          docker build -t ghcr.io/artyomsv/spire-ui:edge ./spire-ui

      # Obviously-synthetic values. The two keysets are generated per run so none is ever committed;
      # the realm ships the same three client secrets, and no real credential enters CI.
      - name: Write the environment
        run: |
          {
            echo "SPIRE_UI_PORT=34700"
            echo "SPIRE_KEYCLOAK_PORT=34767"
            echo "POSTGRES_DB=spire"
            echo "POSTGRES_USER=spire"
            echo "POSTGRES_PASSWORD=TEST-postgres-password"
            echo "GATEWAY_POSTGRES_USER=gateway"
            echo "GATEWAY_POSTGRES_PASSWORD=TEST-gateway-password"
            echo "SPIRE_ENCRYPTION_KEYSET=$(./gradlew -q :spire-encryption:generateKeyset --console=plain | tail -1)"
            echo "SPIRE_ENCRYPTION_WEBHOOK_KEYSET=$(./gradlew -q :spire-encryption:generateKeyset --console=plain | tail -1)"
            echo "SPIRE_OIDC_AUTH_SERVER_URL=http://host.docker.internal:34767/realms/spire"
            echo "SPIRE_OIDC_ORCHESTRATOR_SECRET=dev-only-orchestrator-secret"
            echo "SPIRE_OIDC_GATEWAY_SECRET=dev-only-gateway-secret"
            echo "SPIRE_OIDC_WORKER_SECRET=dev-only-worker-secret"
            echo "KEYCLOAK_ADMIN_USER=dev-admin"
            echo "KEYCLOAK_ADMIN_PASSWORD=TEST-keycloak-admin"
            echo "SPIRE_TRUSTED_PROXIES=172.16.0.0/12"
            echo "SPIRE_VERSION=edge"
          } > deploy/.env
          grep -qE '^SPIRE_ENCRYPTION_KEYSET=.+' deploy/.env || { echo "keyset generation produced nothing"; exit 1; }

      - name: Up
        run: docker compose -f deploy/compose.ghcr.yml --env-file deploy/.env up -d

      - name: Wait for the dashboard
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:34700/api/me; then exit 0; fi
            sleep 5
          done
          echo "the dashboard never became reachable"; exit 1

      - name: Round-trip
        env:
          DEV_VIEWER_PASSWORD: dev-viewer
          DEV_OPERATOR_PASSWORD: dev-operator
        run: |
          set -a; . deploy/.env; set +a
          export SPIRE_COMPOSE_FILE=deploy/compose.ghcr.yml
          bash ./deploy/e2e.sh http://localhost:34700 http://localhost:34767

      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.ghcr.yml --env-file deploy/.env logs --tail 200
      - name: Down
        if: always()
        run: docker compose -f deploy/compose.ghcr.yml --env-file deploy/.env down -v

  publish:
    name: ${{ matrix.name }}
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: spire-gateway
            context: .
            dockerfile: Dockerfile
            service: gateway
          - name: spire-orchestrator
            context: .
            dockerfile: Dockerfile
            service: orchestrator
          - name: spire-review-worker
            context: .
            dockerfile: Dockerfile
            service: review-worker
          - name: spire-ui
            context: ./spire-ui
            dockerfile: ./spire-ui/Dockerfile
            service: ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.service && format('SERVICE={0}', matrix.service) || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/artyomsv/${{ matrix.name }}:${{ env.VERSION }}
            ghcr.io/artyomsv/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}

      # Keyless, so there is no signing key to hold or rotate: the signature is bound to this
      # workflow's OIDC identity.
      - name: Sign
        run: cosign sign --yes "ghcr.io/artyomsv/${{ matrix.name }}@${{ steps.push.outputs.digest }}"

  github-release:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Package the chart at this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/spire --version "$VERSION" --app-version "$VERSION" -d dist/

      # Auto-generated notes rather than a CHANGELOG file: the commit discipline here already reads as
      # release notes, and a maintained file is one more thing that can go stale or fail a release by
      # omission.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tgz
