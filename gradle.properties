quarkusPluginVersion=3.37.1
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.37.1

org.gradle.parallel=true
org.gradle.caching=true

# Gradle defaults the build JVM to 512m. With parallel on, the three Quarkus services compile at the
# same time, which puts compileTestJava right on that ceiling: CI's service-tier job died with
# "OutOfMemoryError: Java heap space" five times in one day, on unrelated branches and independently
# of any dependency change. It read as flakiness because whether it tipped over depended on the
# runner, not on the commit.
#
# An explicit heap is the fix. 3g is comfortably inside a 16GB CI runner while still leaving room for
# the Testcontainers Postgres and Kafka the service tests start. Metaspace is raised alongside it
# because Quarkus builds load a lot of classes and Gradle's 384m default is the next ceiling up.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
