quarkus:
  # Both are separate dev services and BOTH must be off, or either starts a Keycloak container of
  # its own that then times out (~60s) on every build.
  keycloak:
    devservices:
      enabled: false
  oidc:
    devservices:
      enabled: false
    # Operator authentication (D10 slice 2). Values measured in the phase-0 spike — see
    # docs/D10-AUTH-PLAN.md §4; each comment says what breaks when the line is missing.
    auth-server-url: ${SPIRE_OIDC_AUTH_SERVER_URL}
    client-id: ${SPIRE_OIDC_CLIENT_ID:spire-review-worker}
    credentials:
      secret: ${SPIRE_OIDC_CLIENT_SECRET}
    application-type: hybrid
    authentication:
      # This service's own prefix, so the browser never sends its session cookie to another service.
      cookie-path: /wk
      cookie-suffix: wk
      java-script-auto-redirect: false
      # Without it the redirect_uri is the REQUESTED path, which no realm can enumerate; it must also
      # sit INSIDE cookie-path or the callback never receives the state cookie.
      redirect-path: /wk/auth/callback
      restore-path-after-redirect: true
    # Without this, login succeeds with ZERO roles and every @RolesAllowed denies every operator.
    roles:
      source: accesstoken
    # Needs the realm's audience mapper, or login fails with "No Audience (aud) claim present".
    token:
      audience: ${SPIRE_OIDC_CLIENT_ID:spire-review-worker}
  application:
    name: spire-review-worker
  http:
    # Deny by default — anything not named here requires authentication.
    auth:
      permission:
        public:
          paths: /q/health,/q/health/*
          policy: permit
        operator:
          paths: /wk/*
          policy: authenticated
    port: ${WORKER_HTTP_PORT:34082}   # health + review-context endpoints; 34xxx project range
  datasource:
    db-kind: postgresql
    jdbc:
      additional-jdbc-properties:
        currentSchema: worker
  flyway:
    migrate-at-start: true
    # schema-per-service (ADR-011/DATA-MODEL): the worker owns ONLY
    # comment_idempotency, in its own schema.
    default-schema: worker
    create-schemas: true
  # Structured JSON logs in prod (observability rule); %dev/%test flip back to
  # plain console below. service/env ride on every line as static fields.
  log:
    console:
      json:
        enabled: true
        additional-field:
          service:
            value: spire-review-worker
          env:
            value: ${quarkus.profile}

# Providers (ADR-001 fail-fast — no defaults outside dev/test). Credentials map
# canonically from env (SPIRE_SCM_BITBUCKET_*, SPIRE_LLM_*, see .env.example).
spire:
  # scm.provider defaults to "active" in code (WorkerScmClients): the worker routes
  # the per-command credential the orchestrator brokers. Set it to "stub" only for
  # the local canned demo (SMOKE-TEST Mode A) — %test does so below.
  llm:
    # Mode flag only (NOT credentials): stub forces the canned dev/test LLM;
    # registry uses the per-command brokered credential from the LLM provider
    # registry (Settings -> LLM, ADR-018). No SPIRE_LLM_BASE_URL/API_KEY/MODEL.
    provider: ${SPIRE_LLM_PROVIDER:registry}   # stub | registry
  review:
    # Writes the fully rendered prompt (system + user, including the fenced context slot) to the log
    # before each model call. OFF by default, and that is a security decision: a rendered prompt
    # carries the whole diff and every retrieved context item, which this project otherwise keeps
    # Tink-encrypted at rest (ADR-014). Enabling it copies that into plaintext logs. Turn it on for
    # the length of a debugging session — when a review cites something surprising and you need to
    # see what the model was actually given — then turn it back off.
    log-prompts: ${SPIRE_REVIEW_LOG_PROMPTS:false}

mp:
  messaging:
    incoming:
      commands-in:
        connector: smallrye-kafka
        topic: cs.commands
        group:
          id: spire-review-worker
        value:
          deserializer: dev.codespire.worker.pipeline.ActionCommandDeserializer
        # work queue: a NEW consumer group must not replay side effects (M6).
        # Poison records: the deserializer maps them to null (skipped, logged);
        # processing failures go to cs.dlq (ADR-013).
        auto:
          offset:
            reset: latest
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: cs.dlq
    outgoing:
      results-out:
        connector: smallrye-kafka
        topic: cs.results
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        value:
          serializer: dev.codespire.worker.pipeline.IntegrationEventSerializer

# Prod: the packaged deployment runs behind the dashboard image's nginx, which is the ONLY ingress
# and puts all four services on one origin so ADR-022's cookie-path scoping actually isolates them.
"%prod":
  quarkus:
    http:
      proxy:
        # Without this the service sees the proxy's address rather than the client's, and OIDC derives
        # redirect_uri from the wrong host. Nothing in dev needed it: Vite forwards no X-Forwarded-*.
        proxy-address-forwarding: true
        # Paired with the line above and equally required: proxy-address-forwarding alone honours
        # X-Forwarded-For and -Proto but NOT -Host, so OIDC still derived redirect_uri from this
        # service's own bind address (http://worker:8080/...) and no realm could match it.
        enable-forwarded-host: true
        # Paired deliberately. docs/D10-AUTH-PLAN.md records the setting above as a header-spoofing
        # vector while service ports stay directly reachable — unpaired, anything that can reach this
        # port forges X-Forwarded-For and -Proto. No deploy artifact publishes a service port, and
        # deploy/helm/spire/tests/render.sh asserts that. No default: the value is topology-specific.
        trusted-proxies: ${SPIRE_TRUSTED_PROXIES}
    oidc:
      authentication:
        # A TLS terminator that forwards over plain http would otherwise yield a session cookie with
        # no Secure attribute, on a credential SECURITY.md already calls replayable in plaintext.
        cookie-force-secure: true

"%dev":
  kafka:
    bootstrap:
      servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:34092}
  quarkus:
    oidc:
      # Dev runs without an identity provider, so the tenant has nothing to discover and the service
      # would refuse to boot. Build-time disable is what works — `tenant-enabled: false` still
      # demands an auth-server-url (measured in the spike).
      enabled: false
    http:
      auth:
        permission:
          # The other half of the switch below: with OIDC disabled there is no mechanism to satisfy
          # `authenticated`, so leaving it would 401 every dev request rather than open it.
          operator:
            policy: permit
    log:
      console:
        json:
          enabled: false   # plain console for local readability
    datasource:
      username: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      jdbc:
        url: jdbc:postgresql://localhost:${POSTGRES_PORT:34432}/${POSTGRES_DB:spire}
  spire:
    security:
      # BOTH gates open together, or dev is half-authenticated: the permission policy below decides
      # whether an identity is required at all, and this governs the @RolesAllowed checks that run
      # afterwards. Opening only one gave 403 on REST while the socket answered 101 on the gateway.
      auth-enabled: false
    # scm.stub is false in dev -> real reviews against the brokered credential.
    # Export SPIRE_SCM_STUB=true for the canned stub demo (Mode A).
    llm:
      provider: ${SPIRE_LLM_PROVIDER:stub}

# Test: DevServices boot Postgres + a broker automatically.
"%test":
  quarkus:
    oidc:
      # Build-time disable. `tenant-enabled: false` is NOT enough — the tenant still demands an
      # auth-server-url and the app fails to BOOT, which surfaces as one failed test and every other
      # one skipped rather than as a configuration error.
      #
      # Authorization itself stays ON: the behavioural suites carry a @TestSecurity identity, so they
      # exercise the real permission policy and the real annotations.
      enabled: false
    http:
      port: 0
      test-port: 0
    log:
      console:
        json:
          enabled: false   # plain console keeps test output readable
  mp:
    messaging:
      incoming:
        commands-in:
          auto:
            offset:
              reset: earliest
  spire:
    scm:
      stub: true                       # worker tests use stub SCM adapters by default
    llm:
      provider: stub
    encryption:
      # Test-only AES-GCM keyset (not a secret) — matches the orchestrator's, so
      # a worker test could decrypt a credential the orchestrator packed. Prod/dev
      # read SPIRE_ENCRYPTION_KEYSET (ADR-015).
      keyset: 
