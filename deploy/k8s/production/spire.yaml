# Source: spire/templates/ui.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-ui
  labels:
    app.kubernetes.io/name: spire
    app.kubernetes.io/instance: spire
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "edge"
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: "ghcr.io/artyomsv/spire-ui:edge"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Service DNS, resolved at REQUEST time by the template's resolver — so this pod does not
            # crash-loop when it starts before its siblings, and does not pin a stale address if a
            # Service is recreated.
            - name: SPIRE_ORCHESTRATOR_URL
              value: http://spire-orchestrator:8080
            - name: SPIRE_GATEWAY_URL
              value: http://spire-gateway:8080
            - name: SPIRE_WORKER_URL
              value: http://spire-worker:8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
