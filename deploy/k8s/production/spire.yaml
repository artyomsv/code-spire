# Source: spire/templates/gateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-gateway
  labels:
    app.kubernetes.io/name: spire
    app.kubernetes.io/instance: spire
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "edge"
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: "ghcr.io/artyomsv/spire-gateway:edge"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: QUARKUS_PROFILE
              value: prod
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://postgres.example.invalid:5432/spire
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.example.invalid:9092"
            - name: SPIRE_OIDC_AUTH_SERVER_URL
              value: "https://idp.example.invalid/realms/spire"
            - name: SPIRE_TRUSTED_PROXIES
              value: "10.244.0.0/16"
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: spire-config
                  key: GATEWAY_POSTGRES_USER
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spire-gateway-secrets
                  key: GATEWAY_POSTGRES_PASSWORD
            - name: SPIRE_ENCRYPTION_WEBHOOK_KEYSET
              valueFrom:
                secretKeyRef:
                  name: spire-gateway-secrets
                  key: SPIRE_ENCRYPTION_WEBHOOK_KEYSET
            - name: SPIRE_OIDC_CLIENT_ID
              value: spire-gateway
            - name: SPIRE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: spire-secrets
                  key: SPIRE_OIDC_GATEWAY_SECRET
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi
