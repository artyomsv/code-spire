---
# Source: spire/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spire
  labels:
    app.kubernetes.io/name: spire
    app.kubernetes.io/instance: spire
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "edge"
  annotations:
    # WebSocket connections on /api/ws/* and /gw/ws/* are long-lived; a controller's default read
    # timeout would cut them and produce reconnect churn the dashboard reports as an outage.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - "spire.example.invalid"
      secretName: spire-tls
  rules:
    - host: "spire.example.invalid"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spire-ui
                port:
                  name: http
