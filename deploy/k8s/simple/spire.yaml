# Source: spire/templates/bundled-infra.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-keycloak
  labels:
    app.kubernetes.io/name: spire
    app.kubernetes.io/instance: spire
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "edge"
    app.kubernetes.io/component: oidc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire
      app.kubernetes.io/component: oidc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire
        app.kubernetes.io/component: oidc
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.5.5
          args: ["start-dev", "--http-port=8080"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spire-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            # PINNED. An unpinned instance derives its issuer from the Host it was reached by, so the
            # browser's issuer and the pods' would disagree and every token would fail validation.
            # BACKCHANNEL_DYNAMIC lets in-cluster callers use the Service name while the issuer stays
            # the browser-facing one.
            - name: KC_HOSTNAME
              value: "http://spire.example.invalid:34767"
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # 1000 is the keycloak user in the official image.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 24
