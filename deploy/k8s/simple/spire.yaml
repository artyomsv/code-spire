# Source: spire/templates/bundled-infra.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-redpanda
  labels:
    app.kubernetes.io/name: spire
    app.kubernetes.io/instance: spire
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "edge"
    app.kubernetes.io/component: kafka
spec:
  serviceName: spire-redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire
        app.kubernetes.io/component: kafka
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v26.1.12
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=1G
            - --reserve-memory=0M
            - --node-id=0
            - --check=false
            # One listener: nothing outside the cluster talks to the broker.
            - --kafka-addr=INTERNAL://0.0.0.0:9092
            - --advertise-kafka-addr=INTERNAL://spire-redpanda:9092
          ports:
            - name: kafka
              containerPort: 9092
          # 101 is the redpanda user in the official image.
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "rpk cluster health --exit-when-healthy"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
