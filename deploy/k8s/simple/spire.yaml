# Source: spire/templates/bundled-infra.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-postgres
  labels:
    app.kubernetes.io/name: spire
    app.kubernetes.io/instance: spire
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "edge"
    app.kubernetes.io/component: postgres
spec:
  serviceName: spire-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.4-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "spire"
            - name: POSTGRES_USER
              value: "spire"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spire-secrets
                  key: POSTGRES_PASSWORD
            # postgres:18+ wants the PARENT directory mounted: data lives in a versioned subdirectory,
            # which is what makes an in-place pg_upgrade --link possible later.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # 999 is the postgres user in the official image.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
