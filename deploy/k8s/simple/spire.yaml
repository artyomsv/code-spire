# Source: spire/templates/gateway-role-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  # The name carries the revision when this is an ordinary resource: a completed Job's pod template is
  # immutable, so re-applying the same name on `helm upgrade` is rejected.
  name: spire-gateway-role-1
  labels:
    app.kubernetes.io/name: spire
    app.kubernetes.io/instance: spire
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "edge"
  annotations:
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire
        app.kubernetes.io/component: gateway-role
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision
          image: postgres:18.4-alpine
          env:
            - name: PGHOST
              value: "spire-postgres"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "spire"
            - name: PGUSER
              value: "spire"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: spire-secrets
                  key: POSTGRES_PASSWORD
            - name: GATEWAY_USER
              value: "gateway"
            - name: GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spire-gateway-secrets
                  key: GATEWAY_POSTGRES_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # A bundled Postgres is created at the same time as this Job and has to pull its image,
              # initialise a data directory and accept connections first, so the wait is generous.
              # Failing here rather than looping forever is deliberate: the Job's backoffLimit then
              # surfaces it, instead of a pod sitting Running until the install times out.
              for _ in $(seq 1 150); do pg_isready -q && break; sleep 2; done
              pg_isready || { echo "postgres at $PGHOST:$PGPORT never accepted connections"; exit 1; }

              # CREATE ROLE has no IF NOT EXISTS, so the existence check is a separate query. Driven
              # from the shell rather than a DO block because a psql variable cannot be interpolated
              # into the block's string body.
              if [ "$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$GATEWAY_USER'")" != "1" ]; then
                psql -v ON_ERROR_STOP=1 -c "CREATE ROLE \"$GATEWAY_USER\" LOGIN PASSWORD '$GATEWAY_PASSWORD'"
              fi

              # Deliberately grants NOTHING on the orchestrator schema. Widening this to clear a
              # permission error collapses the boundary while leaving every piece of configuration
              # looking correct — which is why deploy/e2e.sh probes the live privileges rather than
              # trusting the manifests.
              psql -v ON_ERROR_STOP=1 \
                   -c "CREATE SCHEMA IF NOT EXISTS gateway AUTHORIZATION \"$GATEWAY_USER\""
              echo "gateway role and schema present"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

