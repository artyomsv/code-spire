{{/*
The orchestrator: deciders, sagas, the event store and the operator API. Holds the MASTER keyset,
which decrypts event payloads and provider credentials.
*/}}
{{- define "spire.orchestrator.env" -}}
{{ include "spire.commonEnv" . }}
- name: QUARKUS_DATASOURCE_USERNAME
  valueFrom:
    configMapKeyRef:
      name: spire-config
      key: POSTGRES_USER
- name: QUARKUS_DATASOURCE_PASSWORD
  valueFrom:
    {{- include "spire.dbPasswordRef" . | nindent 4 }}
- name: SPIRE_ENCRYPTION_KEYSET
  valueFrom:
    secretKeyRef:
      name: {{ include "spire.secretName" . }}
      key: SPIRE_ENCRYPTION_KEYSET
- name: SPIRE_OIDC_CLIENT_ID
  value: spire-orchestrator
- name: SPIRE_OIDC_CLIENT_SECRET
  valueFrom:
    secretKeyRef:
      name: {{ include "spire.secretName" . }}
      key: SPIRE_OIDC_ORCHESTRATOR_SECRET
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-orchestrator
  labels:
    {{- include "spire.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire
        app.kubernetes.io/component: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: {{ include "spire.image" (dict "root" . "name" "spire-orchestrator") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "spire.env" (dict "root" . "service" "orchestrator" "own" (include "spire.orchestrator.env" .)) | nindent 12 }}
          {{- with .Values.orchestrator.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "spire.probes" . | nindent 10 }}
          {{- include "spire.securityContext" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources.services | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: spire-orchestrator
  labels:
    {{- include "spire.labels" . | nindent 4 }}
spec:
  # ClusterIP deliberately: the dashboard is the only ingress, which is what makes trustedProxies
  # meaningful — nothing can bypass the proxy to forge a forwarded header.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spire
    app.kubernetes.io/component: orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: http
