{{/*
The dashboard — and the reverse proxy that puts all four services on ONE origin.

That is the mechanism ADR-022 depends on, not a convenience: each service scopes its session cookie to
its own URL path, cookies scope by host AND path, so a split origin would hand one service another's
credential. The routing itself lives in spire-ui/nginx/default.conf.template, which tests/render.sh
asserts over directly because it is baked into the image rather than templated here.

This is the only workload reachable from outside the cluster.
*/}}
{{- define "spire.ui.env" -}}
# Service DNS, resolved at REQUEST time by the template's resolver — so this pod does not
# crash-loop when it starts before its siblings, and does not pin a stale address if a
# Service is recreated. Fully qualified, because nginx's own resolver sends the name as given
# and never applies resolv.conf's search domains: a short name like spire-orchestrator is
# looked up as-is, fails, and every /api, /gw and /wk request answers 502 while /healthz and
# the static dashboard stay green. The namespace comes from the pod itself, not from the render:
# a manifest rendered once and placed in another namespace by kustomize keeps working.
{{- $suffix := printf "$(SPIRE_POD_NAMESPACE).svc.%s" .Values.clusterDomain }}
- name: SPIRE_POD_NAMESPACE
  valueFrom:
    fieldRef:
      fieldPath: metadata.namespace
- name: SPIRE_ORCHESTRATOR_URL
  value: http://spire-orchestrator.{{ $suffix }}:8080
- name: SPIRE_GATEWAY_URL
  value: http://spire-gateway.{{ $suffix }}:8080
- name: SPIRE_WORKER_URL
  value: http://spire-worker.{{ $suffix }}:8080
{{- with .Values.publicHost }}
# Pins the Host the proxy forwards, which is what OIDC builds redirect_uri from. Omitted
# entirely when unset, so the image's own empty default applies and every Host is
# forwarded as sent — including the pod IP a kubelet probe addresses.
- name: SPIRE_PUBLIC_HOST
  value: {{ . | quote }}
{{- end }}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-ui
  labels:
    {{- include "spire.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: {{ include "spire.image" (dict "root" . "name" "spire-ui") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "spire.env" (dict "root" . "service" "ui" "own" (include "spire.ui.env" .)) | nindent 12 }}
          {{- with .Values.ui.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources.ui | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: spire-ui
  labels:
    {{- include "spire.labels" . | nindent 4 }}
  {{- with .Values.ui.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- $type := .Values.ui.service.type | default "ClusterIP" }}
  {{- if not (has $type (list "ClusterIP" "NodePort" "LoadBalancer")) }}
  {{- fail (printf "ui.service.type is %q. It must be ClusterIP, NodePort or LoadBalancer." $type) }}
  {{- end }}
  {{- /* The only Service that may leave the cluster. A NodePort or LoadBalancer publishes plaintext
       beside the TLS terminator (docs/TLS.md requirement 3), so ClusterIP stays the default. */}}
  type: {{ $type }}
  {{- if eq $type "LoadBalancer" }}
  {{- with .Values.ui.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    app.kubernetes.io/name: spire
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 8080
      targetPort: http
