{{/*
The gateway: the internet-facing webhook edge and the per-repo webhook registry.

Two things about it are deliberate and easy to undo by accident:

  - It receives the WEBHOOK keyset and never the master one, so a compromised edge can decrypt webhook
    secrets and nothing else (ADR-015).
  - It connects as its own schema-scoped Postgres role, which owns only the `gateway` schema and is
    never granted `orchestrator`.

Both are asserted by tests/render.sh, because flattening either would fail nothing and break
everything.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-gateway
  labels:
    {{- include "spire.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.registry }}/spire-gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "spire.commonEnv" . | nindent 12 }}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: spire-config
                  key: GATEWAY_POSTGRES_USER
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spire.gatewaySecretName" . }}
                  key: GATEWAY_POSTGRES_PASSWORD
            - name: SPIRE_ENCRYPTION_WEBHOOK_KEYSET
              valueFrom:
                secretKeyRef:
                  name: {{ include "spire.gatewaySecretName" . }}
                  key: SPIRE_ENCRYPTION_WEBHOOK_KEYSET
            {{- if .Values.gateway.giveMasterKeyset }}
            # TEST-ONLY, and forbidden in any real install. Present so tests/render.sh --self-test can
            # render the shape assertion 1 must catch: a negative assertion passes trivially when a key
            # is renamed, so it has to be shown failing.
            - name: SPIRE_ENCRYPTION_KEYSET
              valueFrom:
                secretKeyRef:
                  name: {{ include "spire.secretName" . }}
                  key: SPIRE_ENCRYPTION_KEYSET
            {{- end }}
            - name: SPIRE_OIDC_CLIENT_ID
              value: spire-gateway
            - name: SPIRE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "spire.secretName" . }}
                  key: SPIRE_OIDC_GATEWAY_SECRET
          {{- include "spire.probes" . | nindent 10 }}
          {{- include "spire.securityContext" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources.services | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: spire-gateway
  labels:
    {{- include "spire.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spire
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
